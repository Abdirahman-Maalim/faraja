apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faraja-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    tier: database
    {{- include "faraja.commonLabels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: {{ .Values.persistence.storageClassName }}
