apiVersion: v1
kind: Service
metadata:
  name: faraja-db-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    tier: database
    environment: {{ .Values.environment }}
    {{- include "faraja.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: faraja-db-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    tier: database
    environment: {{ .Values.environment }}
    {{- include "faraja.commonLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: postgres
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
