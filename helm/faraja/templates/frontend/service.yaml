apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
    tier: frontend
    {{- include "faraja.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: frontend
    tier: frontend
  ports:
  - port: {{ .Values.frontend.port }}
    targetPort: http
    protocol: TCP
    name: http
