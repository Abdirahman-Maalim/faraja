apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faraja
  namespace: argocd
spec:
  project: faraja
  source:
    repoURL: https://github.com/Abdirahman-Maalim/faraja.git
    targetRevision: eks-deployment
    path: helm/faraja
    helm:
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: faraja-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
