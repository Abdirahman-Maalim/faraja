apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: faraja
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abdirahman-Maalim/faraja.git
    targetRevision: Developer
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: faraja-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
