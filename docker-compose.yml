services:
  db:
    build:
      context: ./database
    image: faraja-db:latest
    container_name: faraja-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - faraja-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - faraja-net

  backend:
    build:
      context: ./backend
    image: faraja-backend:latest
    container_name: faraja-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network, "db" is the hostname (the .env value
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl in the python:3.12-slim image, so we hit FastAPI's own
      # /health route with the stdlib instead.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - faraja-net

  frontend:
    build:
      context: ./frontend
    image: faraja-frontend:latest
    container_name: faraja-frontend
    restart: unless-stopped
    environment:
      # api.ts reads this via globalThis.process at runtime for
      # server-side (SSR) fetches, so it must point at the backend's
      # service name, not localhost. Client-side ("use client") fetches
      # fall back to the hardcoded 127.0.0.1:8000 default in the code,
      # which works because BACKEND_PORT is published to the host below.
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      # package.json's start script is "next start -p 3001", so the
      # containery listens on 3001, NOT the 3000 that EXPOSE.
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - faraja-net

volumes:
  faraja-db-data:
    name: faraja-db-data

networks:
  faraja-net:
    name: faraja-net
    driver: bridge
