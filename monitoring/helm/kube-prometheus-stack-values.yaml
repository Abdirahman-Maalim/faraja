grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: http://a6fe3c85ae85840d7a99c5403e59d890-1029474605.us-east-1.elb.amazonaws.com/grafana/
      serve_from_sub_path: true
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  readinessProbe:
    httpGet:
      path: /grafana/api/health
  livenessProbe:
    httpGet:
      path: /grafana/api/health
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 800Mi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
