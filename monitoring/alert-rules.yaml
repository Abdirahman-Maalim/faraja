apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: faraja-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: faraja.golden-signals
      rules:
        - alert: FarajaHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="faraja-ns",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{namespace="faraja-ns"}[5m])) * 100 > 1
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Faraja API error rate above 1%"
            description: "Namespace faraja-ns: {{ $value | humanize }}% of requests are 5xx. Impact: users may be seeing failed requests."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/high-error-rate.md"

        - alert: FarajaHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{namespace="faraja-ns"}[5m])) by (le)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Faraja API P95 latency above 500ms"
            description: "Namespace faraja-ns: P95 latency is {{ $value | humanizeDuration }}. Impact: slow responses for users."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/high-latency.md"

    - name: faraja.resources
      rules:
        - alert: FarajaContainerOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="faraja-ns", reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Faraja container was OOMKilled"
            description: "Pod {{ $labels.pod }} container {{ $labels.container }} in faraja-ns was killed for exceeding memory limit. Impact: pod restarted, possible dropped requests."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/oom-killed.md"

        - alert: FarajaHighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="faraja-ns", container!=""}) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="faraja-ns", resource="memory"}) by (pod)
            * 100 > 90
          for: 10m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Faraja pod memory usage above 90% of limit"
            description: "Pod {{ $labels.pod }} in faraja-ns is at {{ $value | humanize }}% of its memory limit. Impact: risk of imminent OOMKill."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/high-memory.md"

        - alert: FarajaPodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="faraja-ns"}[30m]) > 3
          for: 0m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Faraja pod restarting frequently"
            description: "Pod {{ $labels.pod }} in faraja-ns has restarted more than 3 times in 30 minutes. Impact: possible crash loop, degraded availability."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/frequent-restarts.md"

        - alert: FarajaPodNotReady
          expr: |
            kube_pod_status_ready{namespace="faraja-ns", condition="false"} == 1
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Faraja pod is not ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been NotReady for more than 5 minutes."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/pod-not-ready.md"

    - name: faraja.cluster
      rules:
        - alert: FarajaNodeDown
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Node {{ $labels.node }} is down"
            description: "Node {{ $labels.node }} is NotReady or unreachable."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/node-down.md"
        - alert: FarajaPVCPending
          expr: |
            kube_persistentvolumeclaim_status_phase{namespace="faraja-ns", phase="Pending"} == 1
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is pending"
            description: "PVC {{ $labels.persistentvolumeclaim }} in faraja-ns has been Pending for 5+ minutes. Impact: dependent pod cannot start."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/pvc-pending.md"

        - alert: FarajaTrafficDrop
          expr: |
            (
              sum(rate(http_requests_total[5m]))
              /
              sum(rate(http_requests_total[5m] offset 1w))
            ) * 100 < 50
          for: 5m
          labels:
            severity: critical
            team: backend
          annotations:
            summary: "Faraja traffic dropped over 50%"
            description: "Request rate is {{ $value | humanize }}% of last week's rate at this time. Impact: possible outage or upstream issue."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/traffic-drop.md"

        - alert: FarajaCPUThrottlingHigh
          expr: |
            (rate(container_cpu_cfs_throttled_seconds_total{namespace="faraja-ns"}[5m])
            / rate(container_cpu_usage_seconds_total{namespace="faraja-ns"}[5m])) * 100 > 25
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Faraja container CPU throttled above 25%"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is being throttled at {{ $value | humanize }}%. Impact: degraded performance under load."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/cpu-throttling.md"

        - alert: FarajaHighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="faraja-ns", container!=""}[5m])) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="faraja-ns", resource="cpu"}) by (pod)
            * 100 > 90
          for: 15m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "Faraja pod CPU usage above 90% of limit"
            description: "Pod {{ $labels.pod }} in faraja-ns is at {{ $value | humanize }}% of its CPU limit for 15+ minutes. Impact: risk of throttling, degraded response times."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/high-cpu-usage.md"

        - alert: FarajaHPAMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="faraja-ns"}
            == kube_horizontalpodautoscaler_spec_max_replicas{namespace="faraja-ns"}
          for: 15m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"
            description: "HPA has been at its max replica count for 15+ minutes. Impact: cannot scale further to absorb more load."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/hpa-max-replicas.md"
        - alert: CoreDNSDown
          expr: |
            kube_deployment_status_replicas_available{deployment="coredns", namespace="kube-system"} == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "CoreDNS is down"
            description: "CoreDNS has zero available replicas. Impact: all in-cluster service discovery fails — pods cannot resolve Service names, breaking backend-to-database and frontend-to-backend communication."
            runbook_url: "https://github.com/teqeva/Faraja/blob/main/docs/runbooks/coredns-down.md"