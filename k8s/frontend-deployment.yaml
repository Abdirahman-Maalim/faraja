apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: faraja-ns
  labels:
    app: frontend
    tier: frontend
    team: cne01
    project: faraja
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
        team: cne01
        project: faraja
    spec:
      containers:
      - name: frontend
        image: faraja-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: API_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-configmap
              key: API_INTERNAL_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5