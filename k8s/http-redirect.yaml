apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: faraja-ns
spec:
  parentRefs:
    - name: faraja-gateway
      sectionName: http
  hostnames:
    - faraja.kubeverse.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
