apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: faraja-gateway
  namespace: faraja-ns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [faraja-ns, monitoring, argocd]
    - name: https
      hostname: faraja.kubeverse.io
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [faraja-ns, monitoring, argocd]
      tls:
        mode: Terminate
        certificateRefs:
          - name: faraja-tls
            kind: Secret
            group: ""
