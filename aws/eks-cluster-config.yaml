apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: faraja-cluster
  region: us-east-1
  version: "1.31"

availabilityZones: ["us-east-1a", "us-east-1b"]

managedNodeGroups:
  - name: faraja-nodes-v2
    instanceType: t3a.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false
addons:
  - name: aws-ebs-csi-driver
iam:
  withOIDC: true
