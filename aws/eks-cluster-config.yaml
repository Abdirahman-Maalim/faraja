apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: faraja-cluster
  region: us-east-1
  version: "1.35"

availabilityZones: ["us-east-1a", "us-east-1b"]

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: faraja-nodes-v3
    instanceType: m7i-flex.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    ssh:
      allow: false

iam:
  withOIDC: true
