apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: faraja-cluster
  region: us-east-1
  version: "1.31"

nodeGroups:
  - name: faraja-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: false

iam:
  withOIDC: true
